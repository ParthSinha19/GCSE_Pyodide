name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:          # pull requests only build (to catch mistakes); they do not deploy
  workflow_dispatch:     # lets you re-run from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Check browser packages exist in this Pyodide version
        run: python scripts/check_packages.py

      - name: Validate notebooks
        run: |
          python - <<'PY'
          import glob, nbformat
          files = sorted(glob.glob("content/**/*.ipynb", recursive=True))
          for f in files:
              nbformat.validate(nbformat.read(f, as_version=4))
              print("valid:", f)
          print(len(files), "notebooks OK")
          PY

      - name: Build JupyterLite and landing page
        run: ./scripts/build.sh

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
